<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森林冒险 · 操作布局稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#142b29;color:#eeead9;font:16px/1.6 system-ui}main{max-width:1100px;margin:24px auto;padding:0 20px}h1{font-size:24px;margin:0}p{color:#bdcbb9}label{margin-right:18px}select,button{font:inherit;color:inherit;background:#30534a;border:1px solid #89a08a;border-radius:12px;padding:8px 12px;min-height:48px;cursor:pointer}header{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.scroll{overflow:auto;padding-bottom:14px}.screen{position:relative;overflow:hidden;border:1px solid #879b83;border-radius:24px;background:#34554b;margin:auto;width:844px;height:390px}.scene{position:absolute;inset:60px 0 96px;background:linear-gradient(130deg,#536d58,#29473f)}.tree{position:absolute;left:5%;top:-10%;width:20%;height:120%;background:#27453f;transform:rotate(8deg)}.soil{position:absolute;bottom:0;height:24%;width:100%;background:#5d6047;border-top:9px solid #829065}.stem{position:absolute;left:56%;bottom:24%;height:48%;width:8px;background:#8aab70;transform:rotate(12deg);border-radius:100%}.axis{position:absolute;left:59%;bottom:67%;width:37%;height:10px;background:#9aac6d;border-radius:100%;transform:rotate(-8deg)}.hero{position:absolute;left:37%;bottom:24%;width:29px;height:56px;background:#4d8291;border-radius:15px 15px 9px 9px;border:2px solid #84adb6}.hero:before{content:'••';position:absolute;inset:5px 2px 24px;background:#17343c;color:#eee9b6;text-align:center;border-radius:50%;line-height:20px}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between}.hp{letter-spacing:3px;color:#d7b57b}.tip{position:absolute;top:12px;left:92px;right:80px;background:#edead7;color:#28453a;padding:6px 10px;border-radius:12px;line-height:1.4;font-size:16px;max-height:66px}.controls{position:absolute;bottom:16px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.pair{display:flex;gap:8px}.controls button{width:56px;height:56px;padding:8px;background:#294d43ed}.controls svg{width:32px;height:32px;stroke:#f0edda;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.context{position:absolute;bottom:81px;right:26px;font-size:14px;background:#294d43;border-radius:8px;padding:2px 7px}.label{position:absolute;bottom:32%;left:16px;color:#d1d8bc;font-size:14px;max-width:120px}.status{min-height:28px;color:#ded9b9}a{color:#d4dca4}
.rotate{display:none;position:absolute;inset:0;background:#203e37;z-index:5;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}.rotate strong{font-size:24px;margin-bottom:12px}</style><main><h1>森林冒险 · 操作布局稿</h1><p>用于审阅按钮、提示和安全区。示意角色与地形不代表最终美术；血量、情境状态为模拟。</p><header><label>尺寸 <select id="size"><option>844×390</option><option>568×320</option><option>812×375</option><option>1024×768</option><option>375×812</option><option>320×568</option></select></label><button id="mode">切换到攀爬状态</button><button id="hint">显示／隐藏提示</button></header><div class="scroll"><div class="screen" id="screen"><div class="rotate" id="rotate"><strong>请横置设备</strong><span>森林冒险仅支持横屏<br>游戏已暂停，旋转后继续</span></div><div class="scene"><div class="tree"></div><div class="soil"></div><div class="stem"></div><div class="axis"></div><div class="hero" id="hero"></div><div class="label">有效游戏视窗<br>落点避开操作带</div></div><div class="hud"><span class="hp" aria-label="三格生命示意">●●●</span><button aria-label="暂停" id="pause">Ⅱ</button></div><div class="tip" id="tip">靠近粗叶柄，点手掌抓住。<br>跳跃可随时离开。</div><span class="context" id="context">抓住</span><div class="controls"><div class="pair"><button aria-label="向左" id="left">◀</button><button aria-label="向右" id="right">▶</button></div><div class="pair"><button aria-label="抓住" id="hand"><svg viewBox="0 0 32 32"><path d="M9 18V9q0-3 3-2v8-11q3-3 4 0v11-10q3-2 4 1v10-7q3-2 4 1v12q0 7-8 7-4 0-7-5L5 18q-1-4 2-3l2 3"/></svg></button><button aria-label="跳跃" id="jump"><svg viewBox="0 0 32 32"><circle cx="18" cy="5" r="3"/><path d="m16 11-5 5-6-2m11-3 5 4 6-5m-11 1-1 10-8 5m8-5 7 2 1 6M3 29h5"/></svg></button></div></div></div></div><p class="status" id="status" aria-live="polite">按钮56×56，相邻8px；所有尺寸保持字号，不用缩字塞屏。</p><p><a href="l01-layout.svg">查看L01尺寸图</a> · <a href="readiness.md">制作补齐说明</a></p></main><script>
let climbing=false;const el=id=>document.getElementById(id);el('size').onchange=()=>{const[w,h]=el('size').value.split('×');el('screen').style.width=w+'px';el('screen').style.height=h+'px';el('rotate').style.display=Number(h)>Number(w)?'flex':'none';el('status').textContent=`已切换${w}×${h}布局。外框尺寸固定，可横向滚动查看。`};function setMode(){climbing=!climbing;el('left').textContent=climbing?'▲':'◀';el('left').ariaLabel=climbing?'上攀':'向左';el('right').textContent=climbing?'▼':'▶';el('right').ariaLabel=climbing?'下攀':'向右';el('context').textContent=climbing?'松手':'抓住';el('hand').ariaLabel=climbing?'松手':'抓住';el('mode').textContent=climbing?'切换到普通状态':'切换到攀爬状态';el('hero').style.left=climbing?'54%':'37%';el('hero').style.bottom=climbing?'44%':'24%';el('tip').textContent=climbing?'按上下攀爬。点腾空人形跳离，或点手掌松手。':'靠近粗叶柄，点手掌抓住。跳跃可随时离开。';}el('mode').onclick=setMode;el('hand').onclick=setMode;el('hint').onclick=()=>el('tip').hidden=!el('tip').hidden;for(const id of ['left','right','jump','pause'])el(id).onclick=()=>el('status').textContent='操作稿反馈：'+el(id).ariaLabel+'（未驱动游戏）';
</script></html>
