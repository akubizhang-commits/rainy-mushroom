<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨后菌语 · Cocos 游戏</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#233d30;color:#f8f5e9;font:15px/1.7 system-ui;display:flex;gap:32px;justify-content:center;align-items:flex-start}iframe{border:0;border-radius:24px;background:#dbe7d7;width:375px;height:812px;flex-shrink:0;box-shadow:0 18px 64px #10221966}aside{width:260px}h1{font-size:25px;margin:16px 0 6px}p{color:#d1dfcf}label{display:block;margin-top:18px}select,button{font:inherit;border:1px solid #7d987f;border-radius:10px;background:#eff2e8;color:#294332;padding:8px;width:100%;cursor:pointer}pre{white-space:pre-wrap;font:12px/1.6 system-ui;max-height:400px;overflow:auto}small{color:#afc4b0}@media(max-width:700px){body{padding:0;display:block}iframe{display:block;width:100vw!important;height:100dvh!important;border-radius:0}aside{width:auto;padding:24px}}
body.device{display:flex;flex-direction:column;align-items:center}body.device iframe{width:var(--device-width,375px)!important;height:var(--device-height,812px)!important;border-radius:18px}body.device aside{width:320px}</style>
<iframe title="雨后菌语 Cocos 游戏" src="../cocos-pilot/build/web-mobile/index.html"></iframe><aside><small>雨后菌语 / COCOS CREATOR</small><h1>走进森林，认识菌物</h1><p>4个生态分区 · 12处生境 · 41种菌物<br>旧版收藏与进度会自动接续。</p><p>WASD 行走，拖动看向<br>空格跳起，C 蹲下，Shift 快跑<br>走近菌物，轻点采集</p><label>预览尺寸<select id="size"><option>375,812</option><option>320,568</option><option>430,932</option></select></label><label>快速查看生境<select id="scene"><option value="">完整游戏首页</option><option value="yn-pine">暖湿针阔混交林</option><option value="yn-alpine">高寒草甸</option><option value="yn-ridge">山脊疏松林</option><option value="hl-meadow">林缘湿草地</option><option value="hl-mixed">红松白桦混交林</option><option value="hl-deadwood">苔藓桦木林</option><option value="jl-mixed">冷湿针阔混交林</option><option value="jl-river">冷湿河谷</option><option value="jl-backwater">溪湾腐木地</option><option value="ln-oak">落叶阔叶林</option><option value="ln-edge">山脚林缘</option><option value="ln-glade">栎林草坡</option></select></label><p><small>预览会生成一次真实探索。游戏中可采集，不代表现实中可食用。</small></p><pre id="smoke" role="status"></pre></aside>
<script>
const frame=document.querySelector('iframe'),query=new URLSearchParams(location.search);if(query.has('trial'))frame.src+='?trial=1';else if(query.has('loadingPreview'))frame.src+='?loadingPreview='+encodeURIComponent(query.get('loadingPreview'));else if(query.has('capture'))frame.src+='?capturePreviews=1';else if(query.has('smoke'))frame.src+='?migrationSmoke=1';else if(query.has('scene')){frame.src+='?scene='+encodeURIComponent(query.get('scene'));document.querySelector('#scene').value=query.get('scene')}
if(query.has('trial')){document.querySelector('h1').textContent='林间寻宝 · A玩法原型';const paragraphs=document.querySelectorAll('aside > p');paragraphs[0].innerHTML='固定俯视 · 点击采集 · 六格背篓<br>试验展柜独立保存，原版收藏不变。';paragraphs[1].innerHTML='轻点落叶堆拨开，再点菌物采集<br>背篓满了？点其中的标本放回<br>选好收获后带回展柜，再玩一局';paragraphs[2].textContent='这是玩法试验，不是已发布版本。游戏标本不能作为现实采食依据。'}
document.querySelector('#size').onchange=e=>{document.body.classList.add('device');const[w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';frame.style.setProperty('--device-width',w+'px');frame.style.setProperty('--device-height',h+'px')};
document.querySelector('#scene').onchange=e=>{frame.src='../cocos-pilot/build/web-mobile/index.html'+(e.target.value?'?scene='+encodeURIComponent(e.target.value):'')};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='rainy-pilot-smoke')return;document.querySelector('#smoke').textContent=(e.data.ok?'PASS':'FAIL')+'\n'+e.data.results.join('\n')+(e.data.error?'\n'+e.data.error:'')});
</script></html>
